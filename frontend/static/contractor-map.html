<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOE Contractor Intelligence Map — FY 2024–2026</title>

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Leaflet MarkerCluster -->
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-primary: #0a0e17;
    --bg-secondary: #111827;
    --bg-tertiary: #1a2235;
    --bg-glass: rgba(17, 24, 39, 0.85);
    --bg-glass-hover: rgba(26, 34, 53, 0.92);
    --border-dim: rgba(99, 130, 191, 0.12);
    --border-active: rgba(99, 130, 191, 0.3);
    --text-primary: #e2e8f0;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --accent-cyan: #00e5ff;
    --accent-glow: rgba(0, 229, 255, 0.15);
    --scan-line: rgba(0, 229, 255, 0.03);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Outfit', sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }

  /* ─── MAP ─── */
  #map {
    position: absolute;
    inset: 0;
    z-index: 1;
  }

  .leaflet-container { background: var(--bg-primary) !important; }

  /* Invert OSM tiles to dark theme */
  .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) saturate(0.3) brightness(0.75) contrast(1.3); }
  .leaflet-control-zoom a {
    background: var(--bg-glass) !important;
    color: var(--text-primary) !important;
    border-color: var(--border-dim) !important;
    backdrop-filter: blur(16px);
  }
  .leaflet-control-zoom a:hover {
    background: var(--bg-glass-hover) !important;
    color: var(--accent-cyan) !important;
  }
  .leaflet-control-attribution {
    background: rgba(10, 14, 23, 0.7) !important;
    color: var(--text-muted) !important;
    font-family: 'JetBrains Mono', monospace !important;
    font-size: 9px !important;
  }
  .leaflet-control-attribution a { color: var(--text-secondary) !important; }

  /* Cluster styling */
  .marker-cluster-small, .marker-cluster-medium, .marker-cluster-large {
    background: rgba(0, 229, 255, 0.12) !important;
    border: 1px solid rgba(0, 229, 255, 0.3) !important;
    backdrop-filter: blur(8px);
  }
  .marker-cluster-small div, .marker-cluster-medium div, .marker-cluster-large div {
    background: rgba(0, 229, 255, 0.2) !important;
    color: #e2e8f0 !important;
    font-family: 'JetBrains Mono', monospace !important;
    font-weight: 600;
    font-size: 12px;
  }
  .marker-cluster-medium { background: rgba(0, 229, 255, 0.18) !important; }
  .marker-cluster-large { background: rgba(0, 229, 255, 0.25) !important; }

  /* ─── TOP BAR ─── */
  #topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px 20px;
    background: linear-gradient(180deg, rgba(10, 14, 23, 0.95) 0%, rgba(10, 14, 23, 0.7) 100%);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border-dim);
  }

  .logo-mark {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }

  .logo-icon {
    width: 32px;
    height: 32px;
    border-radius: 6px;
    background: linear-gradient(135deg, #00e5ff 0%, #7c4dff 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 800;
    color: #0a0e17;
    font-family: 'Outfit', sans-serif;
  }

  .logo-text {
    display: flex;
    flex-direction: column;
    line-height: 1.1;
  }

  .logo-text .title {
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.5px;
    color: var(--text-primary);
  }

  .logo-text .subtitle {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 400;
    color: var(--text-muted);
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  .search-container {
    flex: 1;
    max-width: 420px;
    position: relative;
  }

  #searchInput {
    width: 100%;
    padding: 8px 14px 8px 36px;
    background: var(--bg-tertiary);
    border: 1px solid var(--border-dim);
    border-radius: 8px;
    color: var(--text-primary);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  #searchInput:focus {
    border-color: var(--accent-cyan);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  #searchInput::placeholder { color: var(--text-muted); }

  .search-icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 13px;
  }

  .stats-bar {
    display: flex;
    gap: 20px;
    margin-left: auto;
    flex-shrink: 0;
  }

  .stat {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    line-height: 1.1;
  }

  .stat-value {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 16px;
    color: var(--accent-cyan);
  }

  .stat-label {
    font-size: 9px;
    font-weight: 500;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1.2px;
  }

  /* ─── CATEGORY LEGEND ─── */
  #legend {
    position: fixed;
    bottom: 20px;
    left: 20px;
    z-index: 1000;
    background: var(--bg-glass);
    backdrop-filter: blur(20px);
    border: 1px solid var(--border-dim);
    border-radius: 12px;
    padding: 14px 16px;
    max-width: 260px;
  }

  .legend-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    font-weight: 600;
    color: var(--text-muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .legend-items {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 3px 6px;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.15s;
    user-select: none;
  }

  .legend-item:hover { background: rgba(255,255,255,0.04); }
  .legend-item.dimmed { opacity: 0.25; }

  .legend-swatch {
    width: 14px;
    height: 14px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .legend-swatch svg { width: 14px; height: 14px; }

  .legend-label {
    font-size: 11px;
    font-weight: 400;
    color: var(--text-secondary);
    flex: 1;
  }

  .legend-count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-muted);
  }

  /* ─── DETAIL PANEL ─── */
  #detailPanel {
    position: fixed;
    top: 54px;
    right: -480px;
    bottom: 0;
    width: 460px;
    z-index: 1000;
    background: linear-gradient(180deg, rgba(17, 24, 39, 0.97) 0%, rgba(10, 14, 23, 0.98) 100%);
    backdrop-filter: blur(24px);
    border-left: 1px solid var(--border-dim);
    overflow-y: auto;
    transition: right 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    scrollbar-width: thin;
    scrollbar-color: var(--border-active) transparent;
  }

  #detailPanel.open { right: 0; }

  #detailPanel::-webkit-scrollbar { width: 6px; }
  #detailPanel::-webkit-scrollbar-track { background: transparent; }
  #detailPanel::-webkit-scrollbar-thumb { background: var(--border-active); border-radius: 3px; }

  .panel-header {
    position: sticky;
    top: 0;
    background: linear-gradient(180deg, rgba(17, 24, 39, 0.98) 0%, rgba(17, 24, 39, 0.9) 100%);
    backdrop-filter: blur(20px);
    padding: 20px 24px 16px;
    border-bottom: 1px solid var(--border-dim);
    z-index: 2;
  }

  .panel-close {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 28px;
    height: 28px;
    border: 1px solid var(--border-dim);
    border-radius: 6px;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    transition: all 0.15s;
  }

  .panel-close:hover {
    border-color: var(--accent-cyan);
    color: var(--accent-cyan);
    background: var(--accent-glow);
  }

  .panel-category-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px 10px;
    border-radius: 20px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.5px;
    margin-bottom: 10px;
  }

  .panel-contractor-name {
    font-size: 20px;
    font-weight: 700;
    line-height: 1.2;
    color: var(--text-primary);
    margin-bottom: 4px;
    padding-right: 36px;
  }

  .panel-dba {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 2px;
  }

  .panel-parent {
    font-size: 12px;
    color: var(--text-secondary);
  }

  .panel-parent span { color: var(--accent-cyan); }

  .panel-body { padding: 0 24px 24px; }

  .panel-section {
    padding: 16px 0;
    border-bottom: 1px solid var(--border-dim);
  }

  .panel-section:last-child { border-bottom: none; }

  .section-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    font-weight: 600;
    color: var(--text-muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .data-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .data-cell {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .data-cell.wide { grid-column: 1 / -1; }

  .data-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    font-weight: 500;
    color: var(--text-muted);
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .data-value {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-primary);
    word-break: break-word;
  }

  .data-value.mono {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
  }

  .data-value.highlight {
    color: var(--accent-cyan);
    font-weight: 600;
  }

  .data-value.large {
    font-size: 22px;
    font-weight: 800;
    font-family: 'JetBrains Mono', monospace;
  }

  .tag-list {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }

  .tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 4px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border-dim);
    color: var(--text-secondary);
  }

  .tag.active {
    background: var(--accent-glow);
    border-color: rgba(0, 229, 255, 0.3);
    color: var(--accent-cyan);
  }

  .personnel-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .person {
    font-size: 12px;
    color: var(--text-secondary);
    padding: 4px 8px;
    background: rgba(255,255,255,0.02);
    border-radius: 4px;
    border-left: 2px solid var(--border-dim);
  }

  .role-text {
    font-size: 12px;
    line-height: 1.5;
    color: var(--text-secondary);
  }

  /* ─── SHODAN INTELLIGENCE ─── */
  .shodan-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .shodan-exposure {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-radius: 8px;
    background: rgba(255, 23, 68, 0.06);
    border: 1px solid rgba(255, 23, 68, 0.15);
    margin-bottom: 12px;
  }

  .shodan-exposure.low {
    background: rgba(0, 230, 118, 0.06);
    border-color: rgba(0, 230, 118, 0.15);
  }

  .shodan-exposure.medium {
    background: rgba(255, 209, 64, 0.06);
    border-color: rgba(255, 209, 64, 0.15);
  }

  .exposure-icon {
    font-size: 20px;
    flex-shrink: 0;
  }

  .exposure-detail {
    flex: 1;
  }

  .exposure-count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    font-weight: 700;
  }

  .exposure-label {
    font-size: 10px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .port-badges {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }

  .port-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 4px;
    background: rgba(0, 229, 255, 0.08);
    border: 1px solid rgba(0, 229, 255, 0.2);
    color: var(--accent-cyan);
  }

  .port-badge.risky {
    background: rgba(255, 23, 68, 0.08);
    border-color: rgba(255, 23, 68, 0.2);
    color: #ff1744;
  }

  .service-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 8px;
    border-radius: 4px;
    background: rgba(255,255,255,0.02);
    font-size: 12px;
  }

  .service-row + .service-row { margin-top: 3px; }

  .service-name {
    font-family: 'JetBrains Mono', monospace;
    color: var(--text-primary);
    font-weight: 500;
  }

  .service-count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-muted);
  }

  .vuln-list { display: flex; flex-direction: column; gap: 3px; }

  .vuln-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 4px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .vuln-badge.critical {
    background: rgba(213, 0, 0, 0.12);
    border: 1px solid rgba(213, 0, 0, 0.25);
    color: #ff1744;
  }

  .vuln-badge.high {
    background: rgba(255, 109, 0, 0.1);
    border: 1px solid rgba(255, 109, 0, 0.2);
    color: #ff6d00;
  }

  .vuln-badge.medium {
    background: rgba(255, 209, 64, 0.08);
    border: 1px solid rgba(255, 209, 64, 0.2);
    color: #ffd740;
  }

  .vuln-badge.low {
    background: rgba(0, 230, 118, 0.06);
    border: 1px solid rgba(0, 230, 118, 0.15);
    color: #00e676;
  }

  .vuln-count {
    font-size: 9px;
    opacity: 0.6;
  }

  .shodan-empty {
    text-align: center;
    padding: 16px 12px;
    color: var(--text-muted);
    font-size: 12px;
    background: rgba(255,255,255,0.02);
    border-radius: 8px;
    border: 1px dashed var(--border-dim);
  }

  .host-card {
    padding: 8px 10px;
    background: rgba(255,255,255,0.02);
    border-radius: 6px;
    border-left: 2px solid var(--border-dim);
    font-size: 11px;
  }

  .host-card + .host-card { margin-top: 4px; }

  .host-ip {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    color: var(--accent-cyan);
  }

  .host-meta {
    color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
  }

  /* ─── RELATIONSHIP LINES ─── */
  .relationship-line {
    stroke-dasharray: 6, 4;
    animation: dashFlow 1.5s linear infinite;
  }

  @keyframes dashFlow {
    to { stroke-dashoffset: -20; }
  }

  /* ─── SCAN LINE OVERLAY ─── */
  #scanOverlay {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background: repeating-linear-gradient(
      0deg,
      transparent 0px,
      transparent 3px,
      var(--scan-line) 3px,
      var(--scan-line) 4px
    );
    opacity: 0.5;
  }

  /* ─── SEARCH RESULTS DROPDOWN ─── */
  #searchResults {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    margin-top: 4px;
    background: var(--bg-secondary);
    border: 1px solid var(--border-active);
    border-radius: 8px;
    max-height: 300px;
    overflow-y: auto;
    display: none;
    z-index: 1001;
    box-shadow: 0 12px 40px rgba(0,0,0,0.5);
  }

  #searchResults.visible { display: block; }

  .search-result {
    padding: 8px 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid var(--border-dim);
    transition: background 0.1s;
  }

  .search-result:last-child { border-bottom: none; }
  .search-result:hover { background: var(--bg-tertiary); }

  .search-result .sr-name {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-primary);
    flex: 1;
  }

  .search-result .sr-location {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-muted);
  }

  .search-result .sr-swatch {
    width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0;
  }

  /* ─── LOADING ─── */
  #loadingOverlay {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: var(--bg-primary);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    transition: opacity 0.6s;
  }

  #loadingOverlay.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .loading-spinner {
    width: 48px;
    height: 48px;
    border: 2px solid var(--border-dim);
    border-top-color: var(--accent-cyan);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* ─── RESPONSIVE ─── */
  @media (max-width: 768px) {
    #detailPanel { width: 100%; right: -100%; }
    .stats-bar { display: none; }
    #legend { bottom: 10px; left: 10px; max-width: 200px; padding: 10px; }
    .legend-label { font-size: 10px; }
  }
</style>
</head>
<body>

<!-- Loading overlay -->
<div id="loadingOverlay">
  <div class="loading-spinner"></div>
  <div class="loading-text">Initializing contractor intelligence map</div>
</div>

<!-- CRT scan lines -->
<div id="scanOverlay"></div>

<!-- Top bar -->
<div id="topbar">
  <div class="logo-mark">
    <div class="logo-icon">D</div>
    <div class="logo-text">
      <span class="title">DOE Contractor Intelligence</span>
      <span class="subtitle">FY 2024 – 2026 Due Diligence</span>
    </div>
  </div>

  <div class="search-container">
    <span class="search-icon">&#x1F50D;</span>
    <input type="text" id="searchInput" placeholder="Search contractors, cities, NAICS…" autocomplete="off" />
    <div id="searchResults"></div>
  </div>

  <div class="stats-bar">
    <div class="stat">
      <span class="stat-value" id="statContractors">—</span>
      <span class="stat-label">Contractors</span>
    </div>
    <div class="stat">
      <span class="stat-value" id="statStates">—</span>
      <span class="stat-label">States</span>
    </div>
    <div class="stat">
      <span class="stat-value" id="statLinks">—</span>
      <span class="stat-label">Links</span>
    </div>
    <div class="stat">
      <span class="stat-value" id="statObligation">—</span>
      <span class="stat-label">Total Obligated</span>
    </div>
  </div>
</div>

<!-- Legend -->
<div id="legend">
  <div class="legend-title">Contractor Categories</div>
  <div class="legend-items" id="legendItems"></div>
</div>

<!-- Detail panel -->
<div id="detailPanel">
  <div class="panel-header">
    <button class="panel-close" onclick="closePanel()">✕</button>
    <div id="panelBadge" class="panel-category-badge"></div>
    <div id="panelName" class="panel-contractor-name"></div>
    <div id="panelDba" class="panel-dba"></div>
    <div id="panelParent" class="panel-parent"></div>
  </div>
  <div class="panel-body" id="panelBody"></div>
</div>

<!-- Map container -->
<div id="map"></div>

<script>
// ═══════════════════════════════════════════════════════════════
// SVG MARKER SHAPES
// ═══════════════════════════════════════════════════════════════

function createMarkerSVG(shape, color, size = 24) {
  const half = size / 2;
  const r = size * 0.35;
  let path;

  switch (shape) {
    case 'hexagon': {
      const pts = [];
      for (let i = 0; i < 6; i++) {
        const angle = (Math.PI / 3) * i - Math.PI / 6;
        pts.push(`${half + r * Math.cos(angle)},${half + r * Math.sin(angle)}`);
      }
      path = `<polygon points="${pts.join(' ')}" />`;
      break;
    }
    case 'diamond':
      path = `<polygon points="${half},${half - r} ${half + r},${half} ${half},${half + r} ${half - r},${half}" />`;
      break;
    case 'square':
      path = `<rect x="${half - r * 0.75}" y="${half - r * 0.75}" width="${r * 1.5}" height="${r * 1.5}" rx="2" />`;
      break;
    case 'triangle':
      path = `<polygon points="${half},${half - r} ${half + r},${half + r * 0.7} ${half - r},${half + r * 0.7}" />`;
      break;
    case 'pentagon': {
      const pts = [];
      for (let i = 0; i < 5; i++) {
        const angle = (2 * Math.PI / 5) * i - Math.PI / 2;
        pts.push(`${half + r * Math.cos(angle)},${half + r * Math.sin(angle)}`);
      }
      path = `<polygon points="${pts.join(' ')}" />`;
      break;
    }
    case 'star': {
      const pts = [];
      for (let i = 0; i < 10; i++) {
        const angle = (Math.PI / 5) * i - Math.PI / 2;
        const rad = i % 2 === 0 ? r : r * 0.45;
        pts.push(`${half + rad * Math.cos(angle)},${half + rad * Math.sin(angle)}`);
      }
      path = `<polygon points="${pts.join(' ')}" />`;
      break;
    }
    case 'bolt':
      path = `<polygon points="${half - 2},${half - r} ${half + r * 0.5},${half - r} ${half},${half - 1} ${half + r * 0.4},${half - 1} ${half - r * 0.3},${half + r} ${half + 1},${half + 1} ${half - r * 0.5},${half + 1}" />`;
      break;
    case 'gear': {
      const teeth = 8;
      const outer = r;
      const inner = r * 0.65;
      const pts = [];
      for (let i = 0; i < teeth * 2; i++) {
        const angle = (Math.PI / teeth) * i - Math.PI / 2;
        const rad = i % 2 === 0 ? outer : inner;
        pts.push(`${half + rad * Math.cos(angle)},${half + rad * Math.sin(angle)}`);
      }
      path = `<polygon points="${pts.join(' ')}" />`;
      break;
    }
    case 'arrow':
      path = `<polygon points="${half},${half - r} ${half + r * 0.6},${half} ${half + r * 0.25},${half} ${half + r * 0.25},${half + r} ${half - r * 0.25},${half + r} ${half - r * 0.25},${half} ${half - r * 0.6},${half}" />`;
      break;
    default: // circle
      path = `<circle cx="${half}" cy="${half}" r="${r}" />`;
  }

  return `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <defs>
      <filter id="glow-${shape}" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="2" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <g fill="${color}" fill-opacity="0.85" stroke="${color}" stroke-width="1.2" stroke-opacity="0.5" filter="url(#glow-${shape})">
      ${path}
    </g>
  </svg>`;
}

function createSwatchSVG(shape, color) {
  return createMarkerSVG(shape, color, 14);
}


// ═══════════════════════════════════════════════════════════════
// APPLICATION STATE
// ═══════════════════════════════════════════════════════════════

let DATA = null;
let map = null;
let markerCluster = null;
let allMarkers = [];
let relationshipLines = [];
let activeFilters = new Set();
let selectedContractor = null;

// ═══════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════

async function init() {
  // Initialize map
  map = L.map('map', {
    center: [39.5, -98.5],
    zoom: 5,
    minZoom: 3,
    maxZoom: 20,
    zoomControl: true,
    attributionControl: true,
  });

  // OSM tiles — inverted to dark via CSS filter on .leaflet-tile-pane
  // Full street/building/POI detail at every zoom level
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom: 19,
    maxNativeZoom: 19,
  }).addTo(map);

  // Load data
  try {
    const resp = await fetch('contractors.json');
    DATA = await resp.json();
  } catch (e) {
    console.error('Failed to load contractors.json:', e);
    document.getElementById('loadingOverlay').innerHTML =
      '<div style="color:#ff1744;font-family:JetBrains Mono,monospace;font-size:14px;">ERROR: Could not load contractors.json</div>';
    return;
  }

  populateStats();
  buildLegend();
  addMarkers();
  addRelationshipLines();
  setupSearch();

  // Hide loading
  setTimeout(() => {
    document.getElementById('loadingOverlay').classList.add('hidden');
  }, 600);
}

// ═══════════════════════════════════════════════════════════════
// STATS BAR
// ═══════════════════════════════════════════════════════════════

function populateStats() {
  document.getElementById('statContractors').textContent =
    DATA.total_contractors.toLocaleString();

  const states = new Set(DATA.contractors.map(c => c.state));
  document.getElementById('statStates').textContent = states.size;

  document.getElementById('statLinks').textContent =
    DATA.total_relationships;

  const totalObl = DATA.contractors.reduce((sum, c) => sum + (c.obligation || 0), 0);
  document.getElementById('statObligation').textContent =
    '$' + (totalObl / 1e9).toFixed(1) + 'B';
}

// ═══════════════════════════════════════════════════════════════
// LEGEND
// ═══════════════════════════════════════════════════════════════

function buildLegend() {
  const container = document.getElementById('legendItems');
  const cats = Object.entries(DATA.categories);

  cats.sort((a, b) => (DATA.category_counts[b[0]] || 0) - (DATA.category_counts[a[0]] || 0));

  for (const [cat, style] of cats) {
    const count = DATA.category_counts[cat] || 0;
    if (count === 0) continue;

    const item = document.createElement('div');
    item.className = 'legend-item';
    item.dataset.category = cat;
    item.innerHTML = `
      <div class="legend-swatch">${createSwatchSVG(style.shape, style.color)}</div>
      <span class="legend-label">${cat}</span>
      <span class="legend-count">${count}</span>
    `;
    item.addEventListener('click', () => toggleCategoryFilter(cat, item));
    container.appendChild(item);
  }
}

function toggleCategoryFilter(cat, itemEl) {
  if (activeFilters.has(cat)) {
    activeFilters.delete(cat);
    itemEl.classList.remove('dimmed');
  } else {
    activeFilters.add(cat);
    itemEl.classList.add('dimmed');
  }
  refreshMarkerVisibility();
}

function refreshMarkerVisibility() {
  markerCluster.clearLayers();
  const visible = allMarkers.filter(m => !activeFilters.has(m._contractorCategory));
  markerCluster.addLayers(visible);

  // Update relationship line visibility
  relationshipLines.forEach(line => {
    const srcCat = DATA.contractors[line._srcIdx]?.category;
    const tgtCat = DATA.contractors[line._tgtIdx]?.category;
    if (activeFilters.has(srcCat) || activeFilters.has(tgtCat)) {
      line.setStyle({ opacity: 0 });
    } else {
      line.setStyle({ opacity: 0.5 });
    }
  });
}

// ═══════════════════════════════════════════════════════════════
// MARKERS
// ═══════════════════════════════════════════════════════════════

function addMarkers() {
  markerCluster = L.markerClusterGroup({
    chunkedLoading: true,
    maxClusterRadius: 50,
    spiderfyOnMaxZoom: true,
    showCoverageOnHover: false,
    disableClusteringAtZoom: 14,
    iconCreateFunction: function(cluster) {
      const count = cluster.getChildCount();
      let sizeClass = 'small';
      let size = 36;
      if (count > 100) { sizeClass = 'large'; size = 48; }
      else if (count > 30) { sizeClass = 'medium'; size = 42; }

      return L.divIcon({
        html: `<div><span>${count}</span></div>`,
        className: `marker-cluster marker-cluster-${sizeClass}`,
        iconSize: L.point(size, size),
      });
    }
  });

  DATA.contractors.forEach((c, idx) => {
    const svg = createMarkerSVG(c.style.shape, c.style.color, 28);
    const icon = L.divIcon({
      html: svg,
      className: '',
      iconSize: [28, 28],
      iconAnchor: [14, 14],
    });

    const marker = L.marker([c.lat, c.lon], { icon });
    marker._contractorIdx = idx;
    marker._contractorCategory = c.category;

    marker.on('click', () => openDetailPanel(idx));

    allMarkers.push(marker);
  });

  markerCluster.addLayers(allMarkers);
  map.addLayer(markerCluster);
}

// ═══════════════════════════════════════════════════════════════
// RELATIONSHIP LINES
// ═══════════════════════════════════════════════════════════════

function addRelationshipLines() {
  DATA.relationships.forEach(rel => {
    const src = DATA.contractors[rel.source];
    const tgt = DATA.contractors[rel.target];
    if (!src || !tgt) return;

    const line = L.polyline(
      [[src.lat, src.lon], [tgt.lat, tgt.lon]],
      {
        color: '#00e5ff',
        weight: 1.2,
        opacity: 0.4,
        dashArray: '6, 4',
        className: 'relationship-line',
      }
    );

    line._srcIdx = rel.source;
    line._tgtIdx = rel.target;
    line._contractId = rel.contract_id;

    line.bindTooltip(
      `<div style="font-family:JetBrains Mono,monospace;font-size:11px;">
        <strong>Shared Contract</strong><br/>
        ${src.name.substring(0, 30)}${src.name.length > 30 ? '…' : ''}<br/>
        ↔ ${tgt.name.substring(0, 30)}${tgt.name.length > 30 ? '…' : ''}<br/>
        <span style="color:#64748b">${rel.contract_id}</span>
      </div>`,
      { className: 'rel-tooltip', sticky: true }
    );

    line.addTo(map);
    relationshipLines.push(line);
  });
}

// ═══════════════════════════════════════════════════════════════
// DETAIL PANEL
// ═══════════════════════════════════════════════════════════════

function openDetailPanel(idx) {
  const c = DATA.contractors[idx];
  if (!c) return;
  selectedContractor = idx;

  const panel = document.getElementById('detailPanel');

  // Badge
  const badge = document.getElementById('panelBadge');
  badge.innerHTML = `${createSwatchSVG(c.style.shape, c.style.color)} ${c.category}`;
  badge.style.background = c.style.color + '15';
  badge.style.border = `1px solid ${c.style.color}40`;
  badge.style.color = c.style.color;

  // Name
  document.getElementById('panelName').textContent = c.name;

  // DBA
  const dba = document.getElementById('panelDba');
  dba.textContent = c.dba ? `DBA: ${c.dba}` : '';
  dba.style.display = c.dba ? 'block' : 'none';

  // Parent
  const parent = document.getElementById('panelParent');
  if (c.parent) {
    parent.innerHTML = `Parent: <span>${c.parent}</span>`;
    parent.style.display = 'block';
  } else {
    parent.style.display = 'none';
  }

  // Body
  const body = document.getElementById('panelBody');
  body.innerHTML = buildPanelBody(c);

  panel.classList.add('open');
}

function closePanel() {
  document.getElementById('detailPanel').classList.remove('open');
  selectedContractor = null;
}

function buildPanelBody(c) {

        <span class="data-value large highlight">${formatCompact(c.obligation)}</span>
      </div>

        <span class="data-label">Max Potential Award</span>
        <span class="data-value large">${formatCompact(c.max_award)}</span>
      </div>
      <div class="data-cell">
        <span class="data-label">Contracts</span>
        <span class="data-value mono">${c.contract_count}</span>
      </div>
      <div class="data-cell">
        <span class="data-label">Transactions</span>
        <span class="data-value mono">${c.record_count}</span>
      </div>
    </div>
  </div>`;

  // ── Location ──
  html += `
  <div class="panel-section">
    <div class="section-title">Location</div>
    <div class="data-grid">
      <div class="data-cell wide">
        <span class="data-label">Address</span>
        <span class="data-value">${c.address || 'N/A'}</span>
      </div>
      <div class="data-cell">
        <span class="data-label">Coordinates</span>
        <span class="data-value mono">${c.lat.toFixed(4)}, ${c.lon.toFixed(4)}</span>
      </div>
    </div>
  </div>`;

  // ── Classification ──
  html += `
  <div class="panel-section">
    <div class="section-title">Classification</div>
    <div class="data-grid">
      <div class="data-cell wide">
        <span class="data-label">NAICS</span>
        <span class="data-value">${c.naics || 'N/A'}${c.naics_code ? ` <span class="data-value mono" style="color:var(--text-muted)">(${c.naics_code})</span>` : ''}</span>
      </div>
      <div class="data-cell wide">
        <span class="data-label">Product/Service</span>
        <span class="data-value">${c.psc || 'N/A'}</span>
      </div>
      <div class="data-cell">
        <span class="data-label">Award Type</span>
        <span class="data-value mono">${c.award_types || 'N/A'}</span>
      </div>
      <div class="data-cell">
        <span class="data-label">Pricing</span>
        <span class="data-value mono">${c.pricing_types || 'N/A'}</span>
      </div>
    </div>
  </div>`;

  // ── Business Profile ──
  const flags = [];
  if (c.small_business) flags.push('Small Business');
  if (c.woman_owned) flags.push('Woman-Owned');
  if (c.veteran_owned) flags.push('Veteran-Owned');
  if (c.minority_owned) flags.push('Minority-Owned');
  if (c.for_profit) flags.push('For-Profit');
  if (c.nonprofit) flags.push('Nonprofit');

  html += `
  <div class="panel-section">
    <div class="section-title">Business Profile</div>
    <div class="data-grid">
      <div class="data-cell wide">
        <span class="data-label">Size Determination</span>
        <span class="data-value">${c.business_size || 'N/A'}</span>
      </div>
      ${flags.length ? `
      <div class="data-cell wide">
        <span class="data-label">Designations</span>
        <div class="tag-list">
          ${flags.map(f => `<span class="tag active">${f}</span>`).join('')}
        </div>
      </div>` : ''}
    </div>
  </div>`;

  // ── Performance Period ──
  html += `
  <div class="panel-section">
    <div class="section-title">Performance Period</div>
    <div class="data-grid">
      <div class="data-cell">
        <span class="data-label">Fiscal Years</span>
        <span class="data-value mono">${c.fiscal_years || 'N/A'}</span>
      </div>
      <div class="data-cell">
        <span class="data-label">Start</span>
        <span class="data-value mono">${c.performance_start || 'N/A'}</span>
      </div>
      <div class="data-cell">
        <span class="data-label">End</span>
        <span class="data-value mono">${c.performance_end || 'N/A'}</span>
      </div>
    </div>
  </div>`;

  // ── Agencies ──
  if (c.awarding_agencies.length || c.funding_agencies.length) {
    html += `
    <div class="panel-section">
      <div class="section-title">Agencies</div>
      <div class="data-grid">
        ${c.awarding_agencies.length ? `
        <div class="data-cell wide">
          <span class="data-label">Awarding</span>
          <div class="tag-list">
            ${c.awarding_agencies.map(a => `<span class="tag">${a}</span>`).join('')}
          </div>
        </div>` : ''}
        ${c.funding_agencies.length ? `
        <div class="data-cell wide">

    html += `
    <div class="panel-section">

  // ── Role Description ──
  if (c.role) {

      .replace(/^Supports Department of Energy through work described as:\s*/i, '')
      .replace(/IGF::CL,CT::IGF\s*/g, '')
      .replace(/TAS::\d+\s*\d*::TAS\s*/g, '');

      html += `
      <div class="panel-section">
        <div class="section-title">Role for DOE</div>
        <div class="role-text">${roleClean.substring(0, 600)}${roleClean.length > 600 ? '…' : ''}</div>

  // ── Identifiers ──
  html += `

        <span class="data-value mono">${c.uei || 'N/A'}</span>
      </div>
      <div class="data-cell">
        <span class="data-label">CAGE Code</span>
        <span class="data-value mono">${c.cage || 'N/A'}</span>
      </div>
      ${c.phone ? `
      <div class="data-cell">
        <span class="data-label">Phone</span>
        <span class="data-value mono">${c.phone}</span>

      ${c.email ? `
      <div class="data-cell">
        <span class="data-label">Email</span>
        <span class="data-value mono">${c.email}</span>
      </div>` : ''}

  // ── Shodan Intelligence ──
  html += buildShodanSection(c);

  return html;
}

function buildShodanSection(c) {
  const s = c.shodan;

  // No Shodan data at all
  if (!s || !s.queried) {
    return `
    <div class="panel-section">
      <div class="section-title">Shodan Intelligence</div>
      <div class="shodan-empty">Not yet scanned. Run enrich_shodan.py to populate.</div>
    </div>`;
  }

  // Queried but no results
  if (s.total_hosts === 0) {
    return `
    <div class="panel-section">
      <div class="section-title">Shodan Intelligence</div>
      <div class="shodan-empty">No internet-facing hosts found for this organization.</div>
    </div>`;
  }

  let html = '<div class="panel-section"><div class="section-title">Shodan Intelligence</div>';

  // Exposure summary
  const vulnCount = (s.vulns || []).length;
  const level = vulnCount > 10 ? 'high' : vulnCount > 3 ? 'medium' : 'low';
  const levelClass = vulnCount > 10 ? '' : vulnCount > 3 ? 'medium' : 'low';
  const icon = vulnCount > 10 ? '\u26a0' : vulnCount > 3 ? '\u26a0' : '\u2714';

  html += `
  <div class="shodan-exposure ${levelClass}">
    <div class="exposure-icon">${icon}</div>
    <div class="exposure-detail">
      <div class="exposure-count">${s.total_hosts.toLocaleString()}</div>
      <div class="exposure-label">Exposed hosts</div>
    </div>
    <div class="exposure-detail" style="text-align:right">
      <div class="exposure-count">${vulnCount}</div>
      <div class="exposure-label">Known CVEs</div>
    </div>
  </div>`;

  // Ports
  if (s.top_ports && s.top_ports.length) {
    const riskyPorts = new Set([21, 23, 25, 110, 143, 445, 1433, 1521, 3306, 3389, 5432, 5900, 6379, 8080, 8443, 9200, 11211, 27017]);
    html += `<div style="margin-bottom:12px">
      <span class="data-label">Open Ports</span>
      <div class="port-badges" style="margin-top:4px">
        ${s.top_ports.map(p =>
          `<span class="port-badge${riskyPorts.has(p.port) ? ' risky' : ''}">${p.port}<span class="vuln-count" style="margin-left:3px">\u00d7${p.count}</span></span>`
        ).join('')}
      </div>
    </div>`;
  }

  // Services
  if (s.top_services && s.top_services.length) {
    html += `<div style="margin-bottom:12px">
      <span class="data-label">Services Detected</span>
      <div style="margin-top:4px">
        ${s.top_services.slice(0, 8).map(svc =>
          `<div class="service-row"><span class="service-name">${escapeHtml(svc.name)}</span><span class="service-count">${svc.count}</span></div>`
        ).join('')}
      </div>
    </div>`;
  }

  // Vulnerabilities
  if (s.vulns && s.vulns.length) {
    html += `<div style="margin-bottom:12px">
      <span class="data-label">Vulnerabilities</span>
      <div class="vuln-list" style="margin-top:4px">
        ${s.vulns.slice(0, 12).map(v => {
          const severity = getCVESeverity(v.cve);
          return `<span class="vuln-badge ${severity}">${v.cve}<span class="vuln-count">\u00d7${v.count}</span></span>`;
        }).join('')}
      </div>
    </div>`;
  }

  // Domains found
  if (s.domains_found && s.domains_found.length) {
    html += `<div style="margin-bottom:12px">
      <span class="data-label">Domains</span>
      <div class="tag-list" style="margin-top:4px">
        ${s.domains_found.map(d => `<span class="tag">${escapeHtml(d)}</span>`).join('')}
      </div>
    </div>`;
  }

  // ASNs
  if (s.asns && s.asns.length) {
    html += `<div style="margin-bottom:12px">
      <span class="data-label">Autonomous Systems</span>
      <div class="tag-list" style="margin-top:4px">
        ${s.asns.map(a => `<span class="tag">${escapeHtml(a)}</span>`).join('')}
      </div>
    </div>`;
  }

  // Sample hosts
  if (s.sample_hosts && s.sample_hosts.length) {
    html += `<div style="margin-bottom:8px">
      <span class="data-label">Sample Hosts</span>
      <div style="margin-top:4px">
        ${s.sample_hosts.slice(0, 5).map(h => {
          const parts = [`<span class="host-ip">${h.ip}:${h.port}</span>`];
          const meta = [];
          if (h.product) meta.push(h.product + (h.version ? ' ' + h.version : ''));
          if (h.http_title) meta.push('"' + h.http_title.substring(0, 40) + '"');
          if (h.os) meta.push(h.os);
          if (h.hostnames && h.hostnames.length) meta.push(h.hostnames[0]);
          return `<div class="host-card">${parts.join('')}${meta.length ? '<div class="host-meta">' + escapeHtml(meta.join(' \u2022 ')) + '</div>' : ''}</div>`;
        }).join('')}
      </div>
    </div>`;
  }

  // Query info
  html += `<div style="margin-top:8px;font-size:10px;color:var(--text-muted);font-family:JetBrains Mono,monospace;">
    Query: ${escapeHtml(s.query_used || 'N/A')} \u2022 ${s.query_time || ''}
  </div>`;

  html += '</div>';
  return html;
}

function getCVESeverity(cve) {
  // Heuristic based on CVE year and common critical CVEs
  // In production you'd cross-reference CVSS scores
  const year = parseInt(cve.replace('CVE-', '').split('-')[0]);
  if (year >= 2023) return 'critical';
  if (year >= 2021) return 'high';
  if (year >= 2018) return 'medium';
  return 'low';
}

function formatCompact(val) {
  if (!val || val === 0) return 'N/A';
  const abs = Math.abs(val);
  const sign = val < 0 ? '-' : '';
  if (abs >= 1e12) return sign + '$' + (abs / 1e12).toFixed(1) + 'T';
  if (abs >= 1e9) return sign + '$' + (abs / 1e9).toFixed(1) + 'B';
  if (abs >= 1e6) return sign + '$' + (abs / 1e6).toFixed(1) + 'M';
  if (abs >= 1e3) return sign + '$' + (abs / 1e3).toFixed(0) + 'K';
  return sign + '$' + abs.toFixed(0);
}

// ═══════════════════════════════════════════════════════════════
// SEARCH
// ═══════════════════════════════════════════════════════════════

function setupSearch() {
  const input = document.getElementById('searchInput');
  const results = document.getElementById('searchResults');
  let debounceTimer = null;

  input.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => {
      const q = input.value.trim().toLowerCase();
      if (q.length < 2) {
        results.classList.remove('visible');
        return;
      }

      const matches = DATA.contractors
        .map((c, idx) => ({ c, idx }))
        .filter(({ c }) =>
          c.name.toLowerCase().includes(q) ||
          (c.dba && c.dba.toLowerCase().includes(q)) ||
          c.city.toLowerCase().includes(q) ||
          c.state.toLowerCase().includes(q) ||
          c.naics.toLowerCase().includes(q) ||
          c.category.toLowerCase().includes(q) ||
          (c.parent && c.parent.toLowerCase().includes(q))
        )
        .slice(0, 20);

      if (matches.length === 0) {
        results.innerHTML = '<div style="padding:12px;color:var(--text-muted);font-size:12px;text-align:center;">No results found</div>';
      } else {
        results.innerHTML = matches.map(({ c, idx }) => `
          <div class="search-result" data-idx="${idx}">
            <div class="sr-swatch" style="background:${c.style.color}; border-radius:${c.style.shape === 'circle' ? '50%' : '2px'}"></div>
            <span class="sr-name">${highlightMatch(c.name, q)}</span>
            <span class="sr-location">${c.city}, ${c.state}</span>
          </div>
        `).join('');
      }

      results.classList.add('visible');
    }, 150);
  });

  results.addEventListener('click', (e) => {
    const item = e.target.closest('.search-result');
    if (!item) return;
    const idx = parseInt(item.dataset.idx);
    const c = DATA.contractors[idx];
    if (c) {
      map.flyTo([c.lat, c.lon], 13, { duration: 1.2 });
      openDetailPanel(idx);
      results.classList.remove('visible');
      input.value = c.name;
    }
  });

  // Close on outside click
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.search-container')) {
      results.classList.remove('visible');
    }
  });

  // Keyboard navigation
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      results.classList.remove('visible');
      input.blur();
    }
  });
}

function highlightMatch(text, query) {
  const idx = text.toLowerCase().indexOf(query);
  if (idx === -1) return escapeHtml(text);
  return escapeHtml(text.substring(0, idx)) +
    '<strong style="color:var(--accent-cyan)">' +
    escapeHtml(text.substring(idx, idx + query.length)) +
    '</strong>' +
    escapeHtml(text.substring(idx + query.length));
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ═══════════════════════════════════════════════════════════════
// KEYBOARD SHORTCUTS
// ═══════════════════════════════════════════════════════════════

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closePanel();
  if (e.key === '/' && !e.target.closest('input')) {
    e.preventDefault();
    document.getElementById('searchInput').focus();
  }
});
